<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre Dívidas e Sonhos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <!-- Tela 1: Seleção de plataforma -->
        <section id="seletor-plataforma" class="seletor-plataforma">
            <h1>Entre dividas e sonhos</h1>
            <h3>Selecione a plataforma que você está jogando:</h3>

            <div class="opcoes-plataforma">
                <label class="opcao-plataforma">
                    <input type="radio" name="plataforma" value="computador">
                    <img src="/imagem/monitor-vetorial-pc-rato-teclado-design-vetorial_1228438-573-removebg-preview.png" alt="Computador">
                </label>

                <label class="opcao-plataforma">
                    <input type="radio" name="plataforma" value="celular">
                    <img src="https://cdn-icons-png.flaticon.com/512/4423/4423898.png" alt="Celular">
                </label>
            </div>
        </section>

        <!-- Tela 2: Menu Principal -->
        <section id="menu-principal" class="menu-jogo painel hidden">
            <h2>Entre dividas e sonhos</h2>
            <p>Jogando no: <span id="plataforma-selecionada"></span></p>
            
            <!-- Agora o botão Jogar chama a introdução -->
            <button type="button" onclick="iniciarNovoJogo()">Jogar</button>
            <button type="button" onclick="abrirMenu('menu-carregar')">Carregar jogo</button>
            <button type="button" onclick="abrirMenu('menu-opcoes')">Opções</button>
            <button type="button" onclick="abrirMenu('menu-creditos')">Créditos</button>
            <button type="button" onclick="fecharJogo()">Sair</button>
        </section>

        <!-- Tela 3: Submenus -->
        <section id="menu-carregar" class="menu-jogo painel hidden">
            <h2>Carregar Jogo</h2>
            <button type="button">Save 1</button>
            <button type="button">Save 2</button>
            <button type="button" onclick="voltarPrincipal()" class="btn-voltar">Voltar</button>
        </section>

        <section id="menu-opcoes" class="menu-jogo painel hidden">
            <h2>Opções</h2>
            <label for="inputVolume"><h4>Volume:</h4></label>
            <input type="range" id="inputVolume" min="0" max="100" value="50">
            <button type="button" onclick="voltarPrincipal()" class="btn-voltar">Voltar</button>
        </section>

        <section id="menu-creditos" class="menu-jogo painel hidden">
            <h2>Créditos</h2>
            <p>Criado por: Pedro Henrique Parizotto (pedro-hparizotto@estudante.rs.gov.br)</p>
            <button type="button" onclick="voltarPrincipal()" class="btn-voltar">Voltar</button>
        </section>

        <!-- Tela 4: Novo Jogo (Introdução da Lore) -->
        <section id="menu-novo-jogo" class="menu-jogo painel hidden">
            <h2>Nova Esperança - 1980</h2>
            <div id="caixa-texto-intro" class="texto-rpg">
                <!-- O JavaScript injetará a história aqui -->
            </div>
            
            <div class="controles-intro">
                <button type="button" id="btn-avancar-intro" onclick="avancarIntro()">Continuar</button>
                <button type="button" onclick="voltarPrincipal()" class="btn-voltar">Pular</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

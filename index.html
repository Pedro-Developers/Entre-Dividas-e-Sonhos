<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <h1>Entre dividas e sonhos</h1>
    
    <h3>Selecione a plataforma que você está jogando:</h3>

       <div class="seletor-plataforma">
        
        
        <label class="opcao-plataforma">
            <input type="radio" name="plataforma" value="computador" checked>
          
            <img src="https://img.magnific.com/vetores-premium/monitor-vetorial-pc-rato-teclado-design-vetorial_1228438-573.jpg?semt=ais_hybrid&w=740&q=80" alt="Computador" button>
        </label>

    
        <label class="opcao-plataforma">
            <input type="radio" name="plataforma" value="celular">
           
            <img src="https://png.pngtree.com/png-clipart/20250102/original/pngtree-mobile-phone-frame-photo-png-image_19752447.png" alt="Celular" button>
        </label>

    </div>
    <script src="script.js"></script>
</body>
</html>

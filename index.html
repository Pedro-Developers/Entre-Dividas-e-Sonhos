<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app">
        <section id="seletor-plataforma" class="seletor-plataforma">
            <h1>Entre dividas e sonhos</h1>
            <h3>Selecione a plataforma que você está jogando:</h3>

            <div class="opcoes-plataforma">
                <label class="opcao-plataforma">
                    <input type="radio" name="plataforma" value="computador" checked>
                    <img src="/imagem/monitor-vetorial-pc-rato-teclado-design-vetorial_1228438-573-removebg-preview.png" alt="Computador">
                </label>

                <label class="opcao-plataforma">
                    <input type="radio" name="plataforma" value="celular">
                    <img src="https://cdn-icons-png.flaticon.com/512/4423/4423898.png" alt="Celular">
                </label>
            </div>
        </section>

        <section id="menu-jogo" class="menu-jogo hidden">
            <h2>Entre dividas e sonhos</h2>
            <button type="button">Jogar</button>
            <button type="button">Carregar jogo</button>
            <button type="button">Opções</button>
            <button type="button">Créditos</button>
            <button type="button">Sair</button>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
